name: 预编译 rhttp 原生二进制

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rhttp/**'
      - 'scripts/**'
      - 'tool/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/prebuild-rhttp.yml'

concurrency:
  group: prebuild-rhttp
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  Build_Android:
    name: 构建 Android 原生库 (4 ABIs)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.41.4"
          cache: true
      - name: 配置 Rust 1.85.1 及 Android 目标架构
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            i686-linux-android \
            x86_64-linux-android
      - name: 配置 Android NDK 28.0.13004108
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/28.0.13004108" ]; then
            echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108"
          fi
      - name: 准备 rhttp 源码与 Cargokit 构建工具
        id: prepare
        run: python3 scripts/prepare_rhttp.py
      - name: 安装 Cargokit 构建工具依赖
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        run: dart pub get --enforce-lockfile
      - name: 编译并签名 Android 原生二进制
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        env:
          PRIVATE_KEY: ${{ secrets.RHTTP_PREBUILT_PRIVATE_KEY }}
        run: |
          dart run bin/venera_precompile.dart \
            --manifest-dir "${{ steps.prepare.outputs.manifest_dir }}" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --target armv7-linux-androideabi \
            --target aarch64-linux-android \
            --target i686-linux-android \
            --target x86_64-linux-android \
            --android-sdk-location "$ANDROID_SDK_ROOT" \
            --android-ndk-version 28.0.13004108 \
            --android-min-sdk-version 21
      - name: 上传 Android 预编译构件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-android
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  Build_Windows:
    name: 构建 Windows 原生库 (x64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.41.4"
          cache: true
      - name: 配置 Rust 1.85.1 及 Windows 目标架构
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup target add x86_64-pc-windows-msvc
      - name: 准备 rhttp 源码与 Cargokit 构建工具
        id: prepare
        shell: bash
        run: python scripts/prepare_rhttp.py
      - name: 安装 Cargokit 构建工具依赖
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        run: dart pub get --enforce-lockfile
      - name: 编译并签名 Windows 原生二进制
        shell: bash
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        env:
          PRIVATE_KEY: ${{ secrets.RHTTP_PREBUILT_PRIVATE_KEY }}
        run: |
          dart run bin/venera_precompile.dart \
            --manifest-dir "${{ steps.prepare.outputs.manifest_dir }}" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --target x86_64-pc-windows-msvc
      - name: 上传 Windows 预编译构件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  Build_Linux_x64:
    name: 构建 Linux 原生库 (x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.41.4"
          cache: true
      - name: 配置 Rust 1.85.1 及 Linux x64 目标架构
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup target add x86_64-unknown-linux-gnu
      - name: 准备 rhttp 源码与 Cargokit 构建工具
        id: prepare
        run: python3 scripts/prepare_rhttp.py
      - name: 安装 Cargokit 构建工具依赖
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        run: dart pub get --enforce-lockfile
      - name: 编译并签名 Linux x64 原生二进制
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        env:
          PRIVATE_KEY: ${{ secrets.RHTTP_PREBUILT_PRIVATE_KEY }}
        run: |
          dart run bin/venera_precompile.dart \
            --manifest-dir "${{ steps.prepare.outputs.manifest_dir }}" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --target x86_64-unknown-linux-gnu
      - name: 上传 Linux x64 预编译构件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  Build_Linux_arm64:
    name: 构建 Linux 原生库 (arm64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.41.4"
          cache: true
      - name: 配置 Rust 1.85.1 及 Linux arm64 目标架构
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup target add aarch64-unknown-linux-gnu
      - name: 准备 rhttp 源码与 Cargokit 构建工具
        id: prepare
        run: python3 scripts/prepare_rhttp.py
      - name: 安装 Cargokit 构建工具依赖
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        run: dart pub get --enforce-lockfile
      - name: 编译并签名 Linux arm64 原生二进制
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        env:
          PRIVATE_KEY: ${{ secrets.RHTTP_PREBUILT_PRIVATE_KEY }}
        run: |
          dart run bin/venera_precompile.dart \
            --manifest-dir "${{ steps.prepare.outputs.manifest_dir }}" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --target aarch64-unknown-linux-gnu
      - name: 上传 Linux arm64 预编译构件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-linux-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  Build_Apple:
    name: 构建 Apple 原生库 (macOS + iOS 5 Triples)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 切换至 Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 配置 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.41.4"
          cache: true
      - name: 配置 Rust 1.85.1 及 Apple 目标架构
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup target add \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios
      - name: 准备 rhttp 源码与 Cargokit 构建工具
        id: prepare
        run: python3 scripts/prepare_rhttp.py
      - name: 安装 Cargokit 构建工具依赖
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        run: dart pub get --enforce-lockfile
      - name: 编译并签名 Apple 原生二进制
        working-directory: ${{ steps.prepare.outputs.tool_dir }}
        env:
          PRIVATE_KEY: ${{ secrets.RHTTP_PREBUILT_PRIVATE_KEY }}
        run: |
          dart run bin/venera_precompile.dart \
            --manifest-dir "${{ steps.prepare.outputs.manifest_dir }}" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --target x86_64-apple-darwin \
            --target aarch64-apple-darwin \
            --target aarch64-apple-ios \
            --target aarch64-apple-ios-sim \
            --target x86_64-apple-ios
      - name: 上传 Apple 预编译构件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-apple
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  Publish:
    name: 汇总校验并发布预编译 Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs:
      - Build_Android
      - Build_Windows
      - Build_Linux_x64
      - Build_Linux_arm64
      - Build_Apple
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 准备 rhttp 源码与版本元数据
        id: prepare
        run: python3 scripts/prepare_rhttp.py
      - name: 下载全平台构件
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true
      - name: 校验全平台构件与签名文件完整性
        run: python3 scripts/prepare_rhttp.py --check-output dist
      - name: 生成 Release 说明
        run: |
          cat > release_notes.md <<EOF
          # rhttp 预编译原生二进制 (${{ steps.prepare.outputs.release_tag }})

          本 Release 由 CI 自动构建并经过 Ed25519 签名，供 Venera-Plus 及 Cargokit 消费。

          - **包名与版本**: \`rhttp 0.15.1\`
          - **Cargokit CrateHash**: \`${{ steps.prepare.outputs.crate_hash }}\`
          - **Rust 工具链**: \`1.85.1\`
          - **Flutter 版本**: \`${{ steps.prepare.outputs.flutter_version }}\`
          - **Android NDK**: \`28.0.13004108\` (Min SDK 21)
          - **Apple Xcode**: \`16.4\` (macOS 15)
          - **Glibc 基线**: Ubuntu 22.04 LTS (x64 / arm64)

          ### 包含架构构件 (12 Triples, 13 Binaries + 13 .sig + Licenses)
          - **Android**: \`armv7-linux-androideabi\`, \`aarch64-linux-android\`, \`i686-linux-android\`, \`x86_64-linux-android\`
          - **Windows**: \`x86_64-pc-windows-msvc\` (\`rhttp.dll\`, \`rhttp.dll.lib\`)
          - **Linux**: \`x86_64-unknown-linux-gnu\`, \`aarch64-unknown-linux-gnu\`
          - **Apple**: \`x86_64-apple-darwin\`, \`aarch64-apple-darwin\`, \`aarch64-apple-ios\`, \`aarch64-apple-ios-sim\`, \`x86_64-apple-ios\`
          - **许可证**: \`LICENSE\`, \`LICENSE-cargokit\`
          EOF
      - name: 创建并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          # 检查该 tag 是否已被正式发布（避免覆盖已发布正式版本的同名 Release）
          set +e
          existing_release=$(gh release view "$TAG_NAME" --json isDraft,isPrerelease 2>/dev/null)
          view_rc=$?
          set -e

          if [ $view_rc -eq 0 ]; then
            is_draft=$(echo "$existing_release" | jq -r '.isDraft // false')
            if [ "$is_draft" = "false" ]; then
              echo "Release $TAG_NAME 已存在且已正式发布，为避免覆盖已发布二进制，本次跳过发布。"
              exit 0
            else
              echo "Release $TAG_NAME 存在草稿，将复用并更新。"
            fi
          else
            echo "Release $TAG_NAME 尚不存在，先创建草稿 (draft) Release。"
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$TAG_NAME" \
              --notes-file release_notes.md \
              --draft
          fi

          echo "上传构件至 Release $TAG_NAME..."
          gh release upload "$TAG_NAME" dist/* --clobber

          echo "所有构件上传成功，将 Release $TAG_NAME 发布为公开正式版本..."
          gh release edit "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file release_notes.md \
            --draft=false
